# 자동 점검: 코드를 올릴 때마다 타입 검사 · 단위 테스트 · 빌드 · 브라우저 점검 · Rust 테스트를 실행합니다.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  web:
    name: Web (typecheck · unit · build · e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  rust:
    name: Desktop Codex core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: src-tauri/crates/codex_core
